name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff lint and format check
        run: make lint/be

      - name: Run wemake-python-styleguide
        # Merge-blocking. Baseline reached zero violations in TREK-79
        # (WPS Phase 6); the EPIC-4 plan progressed Phase 1 (warn-only)
        # through Phase 6 (refactor + per-file-ignores) to here, Phase 5
        # (CI flip). See docs/architecture/decisions/002-wemake-styleguide.md.
        run: uv run flake8 --select=WPS blunder_tutor/ main.py tests/

      - name: Run i18n lint
        # Strict mode: all four checks fail the build. Baseline was
        # cleaned in TREK-67/-68 (66 dead keys removed, 3 deliberate
        # borrowings allowlisted in the linter). Any future drift —
        # forgotten translation, abandoned key, accidental fallback —
        # fails CI on the introducing PR.
        run: uv run python scripts/lint_i18n.py --strict

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Build frontend
        run: npm ci && npm run build

      - name: Run tests with coverage
        # `-n auto` (xdist) and pytest-randomly ordering come from
        # pyproject `addopts`. CI keeps `-m "not integration"` so the
        # network-touching suite stays out of the default lane; pytest-cov
        # has built-in xdist support — `--cov-report=xml` aggregates
        # worker data automatically.
        run: uv run pytest tests/ -m "not integration" --cov=blunder_tutor --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint-fe:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: npm ci && (cd e2e && npm ci)

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run ESLint and stylelint
        # frontend/ TS, legacy static/js, and CSS.
        run: make lint/fe

      - name: Lint and type-check E2E tests
        run: make lint/e2e typecheck/e2e

  test-fe:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test

      - name: Build frontend
        run: npm run build

  test-e2e-demo:
    name: E2E (demo)
    runs-on: ubuntu-latest
    # Same suite `docker.yml` runs against the release image, but against a
    # source checkout so regressions surface on the PR instead of at tag time.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run demo E2E tests
        # No Stockfish on the runner: the fake only satisfies the startup
        # handshake; import.spec.ts skips its real-analysis test against it.
        env:
          STOCKFISH_BINARY: ${{ github.workspace }}/e2e/fake-stockfish.sh
        run: make test/e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-demo
          path: e2e/playwright-report/
          retention-days: 7

  test-e2e-auth:
    name: E2E (credentials mode)
    runs-on: ubuntu-latest
    # The auth and setup→import flows need credentials mode, a fresh
    # per-run DB, and the fake-stockfish fixture — none of which the
    # production image ships. Run them directly against a source checkout
    # so the Python/uv/fake-stockfish dependencies are all in the workspace.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        # Pre-warm `node_modules/.vite/` so the webServer's own
        # `npm run build` counts under Playwright's test time, not
        # under lifespan startup.
        run: npm run build

      - name: Ensure fake-stockfish is executable
        # Belt-and-braces: the repo stores the exec bit, but rebase /
        # checkout / worktree tooling occasionally strips it on
        # cross-platform edits.
        run: chmod +x e2e/fake-stockfish.sh

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run auth E2E tests
        working-directory: e2e
        run: npx playwright test --config playwright.auth.config.ts

      - name: Run setup → bulk-import E2E test
        # Runs even if the auth suite failed, so one failure doesn't hide the other.
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npx playwright test --config playwright.setup-import.config.ts

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-credentials
          path: |
            e2e/playwright-report-auth/
            e2e/playwright-report-setup-import/
          retention-days: 7
